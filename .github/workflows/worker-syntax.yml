name: worker-syntax
on:
  push:
    paths:
      - "worker/**"
      - ".github/workflows/worker-syntax.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Cloudflare Worker JavaScript syntax
        run: node --check worker/index.js
