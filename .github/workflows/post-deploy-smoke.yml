name: Post-deployment smoke test

on:
  workflow_run:
    workflows: ["Deploy LifeOS Worker"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: life-os-post-deploy-smoke
  cancel-in-progress: false

jobs:
  smoke-test:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify production health endpoint
        id: health
        shell: bash
        run: |
          set -euo pipefail
          url="https://life-os.balaadithya74.workers.dev/health"
          body=""
          for attempt in 1 2 3 4 5; do
            if body="$(curl --connect-timeout 5 --max-time 10 --fail --silent --show-error "$url")"; then
              if printf '%s' "$body" | node -e '
                let s = "";
                process.stdin.on("data", d => s += d);
                process.stdin.on("end", () => {
                  try {
                    const j = JSON.parse(s);
                    if (j.ok !== true || j.service !== "life-os") process.exit(1);
                    if (j.telegramConfigured !== true) process.exit(2);
                    if (j.webhookConfigured !== true) process.exit(3);
                  } catch { process.exit(4); }
                });
              '; then
                echo "Production health check passed."
                exit 0
              fi
            fi
            echo "Health check attempt $attempt/5 failed; retrying."
            sleep 5
          done
          echo "::error::Production health check failed after five attempts."
          exit 1
      - name: Open or update incident issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Production smoke test failed";
            const body = [
              "The automated post-deployment health check did not pass.",
              "",
              "- Target: https://life-os.balaadithya74.workers.dev/health",
              "- Workflow run: " + context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId,
              "- Trigger: " + context.eventName,
              "",
              "Check Worker availability, bindings/secrets, and the deployment logs. Do not paste credentials into this issue."
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const match = existing.data.find(i => i.title === title && !i.pull_request);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body
              });
              core.info("Added details to existing incident issue #" + match.number);
            } else {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
              core.info("Created incident issue #" + issue.data.number);
            }
