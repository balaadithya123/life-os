name: agent-regression-tests
on:
  push:
    paths:
      - "src/devwatch.py"
      - "tests/test_devwatch.py"
      - "src/schedule_intake.py"
      - "tests/test_schedule_intake.py"
      - "agent_office/**"
      - "requirements-dev.txt"
      - ".github/workflows/agent-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Run existing offline tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run Agent Office offline tests
        run: python -m unittest discover -s agent_office/tests -p 'test_*.py' -v
