name: app-lifecycle
on:
  push:
    paths:
      - "inbox/projects/*.json"
      - "inbox/feedback/*.json"
      - "inbox/observations/*.json"
      - "src/project_pipeline.py"
      - "src/project_monitor.py"
      - "tests/test_project_monitor.py"
      - "tests/test_project_pipeline.py"
      - ".github/workflows/app-lifecycle.yml"
  schedule:
    - cron: "30 16 * * *" # Daily 22:00 IST; monitor registered apps and refresh trend report
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: life-os-state
  cancel-in-progress: false
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Run regression tests
        run: python -m pytest -q
      - name: Monitor registered production URLs
        run: python src/project_monitor.py
      - name: Prepare project packs and trend report
        run: python src/project_pipeline.py all
      - name: Notify only changed active incidents
        run: python src/project_pipeline.py notify
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ github.event_name == 'push' && '1' || '0' }}
      - name: Save generated lifecycle state
        run: |
          mkdir -p state/projects
          git config user.name life-os-bot
          git config user.email bot@users.noreply.github.com
          git add state/projects state/observations state/optimisation_report.md state/optimisation_digest.json
          git diff --cached --quiet || (git commit -m "app lifecycle outputs $(date -u +%F-%H%M)" && git pull --rebase && git push)
