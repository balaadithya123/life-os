name: app-lifecycle
on:
  push:
    paths:
      - "inbox/projects/*.json"
      - "inbox/feedback/*.json"
      - "inbox/observations/*.json"
      - "src/project_pipeline.py"
      - "tests/test_project_pipeline.py"
      - ".github/workflows/app-lifecycle.yml"
  schedule:
    - cron: "0 3 * * 1" # Monday 08:30 IST
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: life-os-app-lifecycle
  cancel-in-progress: false
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Run regression tests
        run: python -m pytest -q
      - name: Prepare project packs and trend report
        run: python src/project_pipeline.py all
      - name: Save generated lifecycle state
        run: |
          mkdir -p state/projects
          git config user.name life-os-bot
          git config user.email bot@users.noreply.github.com
          git add state/projects state/optimisation_report.md
          git diff --cached --quiet || (git commit -m "app lifecycle outputs $(date -u +%F-%H%M)" && git pull --rebase && git push)
