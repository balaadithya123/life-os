name: selfcheck
on:
  push:
    paths: ["src/**", "config/**", "requirements.txt", ".github/workflows/**"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - name: test Telegram delivery helpers
        run: python -m unittest discover -s tests -p 'test_telegram_delivery.py' -v
      - run: python src/selfcheck.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
