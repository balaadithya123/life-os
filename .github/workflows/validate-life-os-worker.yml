name: Validate LifeOS Worker

on:
  pull_request:
    paths:
      - "worker/**"
      - "wrangler.toml"
      - "scripts/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "wrangler.toml"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run repository regression tests
        run: python -m pytest -q
      - name: Smoke-test Phase C report generation
        run: |
          python src/phase_c_metrics.py
          test -s state/phase_c_optimisation.md
      - name: Parse all GitHub Actions workflow YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          paths = sorted(Path(".github/workflows").glob("*.yml")) + sorted(Path(".github/workflows").glob("*.yaml"))
          if not paths:
              raise SystemExit("No workflow YAML files found")
          for path in paths:
              with path.open(encoding="utf-8") as handle:
                  yaml.safe_load(handle)
              print(f"parsed {path}")
          PY
      - name: Check JavaScript syntax
        run: node --check worker/index.js
      - name: Validate Worker contract and schedule
        run: node scripts/validate-worker.mjs
      - name: Parse Wrangler configuration
        run: python -c "import tomllib; tomllib.load(open('wrangler.toml', 'rb'))"
