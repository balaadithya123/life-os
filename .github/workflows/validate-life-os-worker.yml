name: Validate LifeOS Worker

on:
  pull_request:
    paths:
      - "worker/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-life-os.yml"
      - ".github/workflows/validate-life-os-worker.yml"
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-life-os.yml"
      - ".github/workflows/validate-life-os-worker.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check JavaScript syntax
        run: node --check worker/index.js
      - name: Parse Wrangler configuration
        run: python -c "import tomllib; tomllib.load(open('wrangler.toml', 'rb'))"
