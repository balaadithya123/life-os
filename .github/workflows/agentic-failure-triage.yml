name: Agentic failure triage
on:
  workflow_run:
    workflows: ["app-lifecycle", "selfcheck"]
    types: [completed]
permissions:
  actions: read
  contents: read
  issues: write
jobs:
  triage:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create issue for failed run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
        run: |
          title="Automation failure: $RUN_NAME run $RUN_ID"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Workflow failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "Failed run: $RUN_URL\n\nReproduce the failure in an isolated branch, add a regression test, and submit a draft PR. Production changes require approval."
          fi
