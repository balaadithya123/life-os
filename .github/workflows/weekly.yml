name: weekly-learn
on:
  schedule: [{cron: "0 2 * * 0"}]   # Sunday 07:30 IST
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: life-os-state, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: python src/learn.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
      - name: save state
        run: |
          git config user.name life-os-bot; git config user.email bot@users.noreply.github.com
          git add state inbox
          git diff --cached --quiet || (git commit -m "state $(date -u +%F-%H%M)" && git pull --rebase && git push)
