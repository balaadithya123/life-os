name: morning-brief
on:
  schedule: [{cron: "30 1 * * *"}]   # 07:00 IST
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: life-os-state, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: python src/radar.py && python src/brief.py
        env: &env
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
      - name: save state
        run: |
          git config user.name life-os-bot; git config user.email bot@users.noreply.github.com
          git add state inbox
          git diff --cached --quiet || (git commit -m "state $(date -u +%F-%H%M)" && git pull --rebase && git push)
